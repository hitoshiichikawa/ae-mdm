# ae-mdm admin-console SPA 用 nginx 設定
# requirements.md Requirement 5.6, 6.5
#
# - SPA fallback: ルーティング未マッチを /index.html にフォールバック
# - /api/admin/ パスを backend api サービスへリバースプロキシ
#   （admin-console は SuperAdmin 専用なので /api/admin/ 配下のみを消費）

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # admin-console 専用 /api/admin/ リバースプロキシ
  location /api/admin/ {
    proxy_pass http://api:8080/api/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # 認証 callback など /api/auth/ も backend に流す（admin-console 用 OIDC コールバック）
  location /api/auth/ {
    proxy_pass http://api:8080/api/admin/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
