# ae-mdm admin-console SPA 用 nginx 設定
# requirements.md Requirement 5.6, 6.5
#
# - SPA fallback: ルーティング未マッチを /index.html にフォールバック
# - /api から始まるパスを backend api サービスへリバースプロキシ（AC 5.6 契約）
#   - /api/admin/ : SuperAdmin 専用エンドポイント（admin-console の主要利用先）
#   - /api/auth/  : admin-console OIDC コールバックを backend の admin auth に書き換え
#   - /api/       : 上記以外の /api/* もすべて backend へ素通しする（AC 5.6 を満たす）
#     （admin SPA が他系統エンドポイントを呼ぶことは設計上想定しないが、
#      AC 5.6 の文言「/api から始まるパスを backend api サービスへリバースプロキシ」
#      を満たすために catch-all を必須とする）

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # admin-console 専用 /api/admin/ リバースプロキシ（longest prefix match）
  location /api/admin/ {
    proxy_pass http://api:8080/api/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # 認証 callback など /api/auth/ も backend に流す（admin-console 用 OIDC コールバック）
  location /api/auth/ {
    proxy_pass http://api:8080/api/admin/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # その他 /api/* は backend にそのまま透過プロキシ（AC 5.6 catch-all）
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
