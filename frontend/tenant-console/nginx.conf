# ae-mdm tenant-console SPA 用 nginx 設定
# requirements.md Requirement 5.6, 6.5
#
# - SPA fallback: ルーティング未マッチを /index.html にフォールバック
# - /api/ から始まるパスを backend api サービスへリバースプロキシ

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # backend api サービスへのリバースプロキシ
  # tenant-console は /api/ 配下のテナント系エンドポイント群（/api/admin/ ではない）を消費
  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
  }

  # SPA fallback: ファイルが無ければ /index.html を返す
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 静的アセットは長期キャッシュ
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
